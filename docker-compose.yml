services:                                                                                           
    vpn-bot:
      build: .                                                                                        
      restart: unless-stopped                                                                         
      env_file: .env                                                                                  
      environment:                                                                                    
        - DB_PATH=/app/vpn_bot.db                                                                     
      volumes:                                                                                      
        - ./vpn_bot.db:/app/vpn_bot.db
        - ./data:/app/data
